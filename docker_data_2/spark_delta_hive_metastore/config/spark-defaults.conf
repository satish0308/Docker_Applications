# Enable Spark Event Logging
spark.eventLog.enabled=true
spark.eventLog.dir=file:///opt/spark/event_logs
spark.history.fs.logDirectory=file:///opt/spark/event_logs

# HDFS & Hive Metastore Warehouse Configuration
spark.sql.catalogImplementation=hive
spark.hadoop.fs.defaultFS=hdfs://namenode:9000
spark.sql.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse

# Delta Lake System-Wide Configurations
spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog

# Cluster Resource Controls & Dynamic Resource Allocation (DRA)
spark.deploy.defaultCores=10
spark.dynamicAllocation.enabled=false
spark.dynamicAllocation.shuffleTracking.enabled=false
spark.dynamicAllocation.executorIdleTimeout=30s
spark.dynamicAllocation.cachedExecutorIdleTimeout=60s
spark.dynamicAllocation.minExecutors=0
spark.dynamicAllocation.maxExecutors=12

# MinIO (S3A) Configurations
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin123
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.driver.memory=6g
spark.executor.memory=10g
spark.executor.cores=10
spark.cores.max=12
spark.sql.shuffle.partitions=300
spark.sql.adaptive.enabled=true
spark.memory.fraction=0.8
spark.memory.storageFraction=0.5

# Enterprise Big Query Resilience & Timeouts (Zero-Timeout Protection)
spark.network.timeout=800s
spark.executor.heartbeatInterval=60s
spark.sql.broadcastTimeout=1800
spark.rpc.askTimeout=800s
spark.rpc.lookupTimeout=800s
spark.core.connection.ack.wait.timeout=800s
spark.storage.blockManagerSlaveTimeoutMs=800000
spark.hadoop.fs.s3a.connection.timeout=600000
spark.hadoop.fs.s3a.socket.timeout=600000
spark.sql.adaptive.coalescePartitions.enabled=true
