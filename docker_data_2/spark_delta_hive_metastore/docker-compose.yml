services:
  postgres:
    image: postgres:13
    container_name: hive-metastore-postgres
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hiveuser
      POSTGRES_PASSWORD: hivepassword
    volumes:
      - ./postgres/init-hive-metastore.sql:/docker-entrypoint-initdb.d/init-hive-metastore.sql
      - ./postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hadoop-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ./postgres/servers.json:/pgadmin4/servers.json
      - ./postgres/.pgpass:/var/lib/pgadmin/.pgpass
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - hadoop-network

  namenode:
    build:
      context: .
      dockerfile: hadoop.Dockerfile
    container_name: namenode
    hostname: namenode
    environment:
      - HDFS_NAMENODE_USER=hdfs
      - HDFS_DATANODE_USER=hdfs
      - HDFS_SECONDARYNAMENODE_USER=hdfs
      - CLUSTER_NAME=hadoop-cluster
      - HDFS_NAMENODE_USER=root
      - HADOOP_SSH_OPTS="-o StrictHostKeyChecking=no"
    volumes:
      - ./hadoop/namenode/data:/home/hadoop/dfs/name
    ports:
      - "9870:9870"
      - "9000:9000"
      - "2222:22"
    networks:
      - hadoop-network

  datanode:
    build:
      context: .
      dockerfile: hadoop.Dockerfile
    container_name: datanode
    hostname: datanode
    environment:
      - HDFS_NAMENODE_USER=hdfs
      - HDFS_DATANODE_USER=hdfs
      - HDFS_SECONDARYNAMENODE_USER=hdfs
    volumes:
      - ./hadoop/datanode/data:/home/hadoop/dfs/data
    ports:
      - "9864:9864"
      - "2223:22"
    networks:
      - hadoop-network

  hive:
    build:
      context: .
      dockerfile: hive.Dockerfile
    container_name: hive-server
    environment:
      - HDFS_NAMENODE_USER=hdfs
      - HDFS_DATANODE_USER=hdfs
      - HDFS_SECONDARYNAMENODE_USER=hdfs
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=metastore
      - POSTGRES_USER=hiveuser
      - POSTGRES_PASSWORD=hivepassword
      - TMPDIR=/tmp/gunicorn
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - AWS_REGION=us-east-1
    volumes:
      - ./scripts/hive_entrypoint.sh:/hive_entrypoint.sh:ro
      - ./config/hive-site.xml:/home/hive/conf/hive-site.xml:ro
      - ./config/core-site.xml:/home/hive/conf/core-site.xml:ro
      - ./config/core-site.xml:/home/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/mapred-site.xml:/home/hadoop/etc/hadoop/mapred-site.xml:ro
      - ./config/yarn-site.xml:/home/hadoop/etc/hadoop/yarn-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/10000'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      - postgres
      - namenode
      - datanode
    ports:
      - "10000:10000"
      - "10002:10002"
    networks:
      - hadoop-network

  hue:
    image: gethue/hue:latest
    container_name: hue
    command: /usr/share/hue/build/env/bin/supervisor
    environment:
      - TMPDIR=/tmp
      - HUE_CONF_DIR=/usr/share/hue/desktop/conf
      - HUE_IGNORE_PASSWORD_SCRIPT_ERRORS=true
      - HUE_DATABASE=postgres
      - HUE_DATABASE_USER=hueuser
      - HUE_DATABASE_PASS=hivepassword
      - HUE_DATABASE_DB=hue
      - HUE_SECRET_KEY=secret
    volumes:
      - ./hue/hue.ini:/usr/share/hue/desktop/conf/hue.ini:ro
    ports:
      - "8888:8888"
    depends_on:
      hive:
        condition: service_healthy
    networks:
      - hadoop-network

  spark:
    build:
      context: .
      dockerfile: spark.Dockerfile
    container_name: spark
    hostname: spark
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark
    volumes:
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./config/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./scripts/start-spark.sh:/home/sparkuser/start-spark2.sh
      - ./python_scripts:/opt/spark/python_scripts
      - ./scripts:/opt/spark/scripts
      - ./backups:/backups
    depends_on:
      - postgres
      - namenode
      - datanode
    ports:
      - "4040:4040"
      - "4041:4041"
      - "18080:18080"
      - "5555:5555"
      - "8089:8080"
    networks:
      - hadoop-network

  spark-worker:
    build:
      context: .
      dockerfile: spark.Dockerfile
    volumes:
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./config/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./scripts/start-spark.sh:/home/sparkuser/start-spark2.sh
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4g
    depends_on:
      - spark
    expose:
      - "8081"
    networks:
      - hadoop-network

  resourcemanager:
    build:
      context: .
      dockerfile: hadoop.Dockerfile
    container_name: resourcemanager
    hostname: resourcemanager
    environment:
      - YARN_RESOURCEMANAGER_HOST=resourcemanager
      - YARN_NODEMANAGER_HOST=nodemanager
    volumes:
      - ./config/core-site.xml:/home/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/home/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/home/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/home/hadoop/etc/hadoop/mapred-site.xml:ro
    ports:
      - "8088:8088"
    networks:
      - hadoop-network
    depends_on:
      - namenode
      - datanode

  nodemanager:
    build:
      context: .
      dockerfile: hadoop.Dockerfile
    container_name: nodemanager
    hostname: nodemanager
    environment:
      - YARN_RESOURCEMANAGER_HOST=resourcemanager
      - YARN_NODEMANAGER_HOST=nodemanager
    volumes:
      - ./config/core-site.xml:/home/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/home/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/yarn-site.xml:/home/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./config/mapred-site.xml:/home/hadoop/etc/hadoop/mapred-site.xml:ro
    ports:
      - "8042:8042"
    networks:
      - hadoop-network
    depends_on:
      - resourcemanager

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_IDENTITY_OPENID_CONFIG_URL: "http://keycloak:8080/realms/bigdata/.well-known/openid-configuration"
      MINIO_IDENTITY_OPENID_CLIENT_ID: "minio"
      MINIO_IDENTITY_OPENID_CLIENT_SECRET: "minio-client-secret-123"
      MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email"
      MINIO_IDENTITY_OPENID_REDIRECT_URI: "http://localhost:9001/oauth_callback"
      MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Login with Keycloak SSO"
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
    depends_on:
      - keycloak
    networks:
      - hadoop-network

  jupyter:
    build:
      context: .
      dockerfile: jupyter.Dockerfile
    container_name: jupyter-notebook
    ports:
      - "8889:8888"
    depends_on:
      - spark
      - minio
    volumes:
      - ./python_scripts:/home/jovyan/work
      - ./scripts:/opt/spark/scripts:ro
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./config/core-site.xml:/opt/spark/conf/core-site.xml:ro
    networks:
      - hadoop-network

  livy:
    build:
      context: .
      dockerfile: livy.Dockerfile
    container_name: livy
    volumes:
      - ./livy/conf/livy.conf:/opt/livy/conf/livy.conf:ro
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./config/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./config/core-site.xml:/opt/spark/conf/core-site.xml:ro
    ports:
      - "8998:8998"
    depends_on:
      - spark
    networks:
      - hadoop-network

  admin-panel:
    build:
      context: ./admin_panel
    container_name: admin-panel
    ports:
      - "8501:8501"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./admin_panel:/app
      - ./python_scripts:/app/python_scripts
      - ./scripts:/app/scripts
      - ./config:/app/config
      - ./backups:/backups
    networks:
      - hadoop-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=hiveuser
      - KC_DB_PASSWORD=hivepassword
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - hadoop-network

networks:
  hadoop-network:
    driver: bridge
    name: hadoop-network
