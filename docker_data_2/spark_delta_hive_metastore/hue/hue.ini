[desktop]
app_blacklist=
auth_backend=desktop.auth.backend.OIDCBackend
logout_redirect_url=http://localhost:8080/realms/bigdata/protocol/openid-connect/logout
gunicorn_workertimeout=1800
server_conn_timeout=1800

[[database]]
engine=postgresql_psycopg2
host=postgres
port=5432
name=hue
user=hueuser
password=hivepassword

[[oidc]]
oidc_op_authorization_endpoint=http://localhost:8080/realms/bigdata/protocol/openid-connect/auth
oidc_op_token_endpoint=http://keycloak:8080/realms/bigdata/protocol/openid-connect/token
oidc_op_user_endpoint=http://keycloak:8080/realms/bigdata/protocol/openid-connect/userinfo
oidc_op_jwks_endpoint=http://keycloak:8080/realms/bigdata/protocol/openid-connect/certs
oidc_rp_client_id=hue
oidc_rp_client_secret=hue-client-secret-123
oidc_verify_ssl=false
login_redirect_url=http://localhost:8888/oidc/callback/
logout_redirect_url=http://localhost:8080/realms/bigdata/protocol/openid-connect/logout
create_users_on_login=true
oidc_username_attribute=preferred_username

[beeswax]
hive_server_host=hive-server
hive_server_port=10000

[spark]
livy_server_url=http://livy:8998
server_url=http://livy:8998
api_url=http://livy:8998
server_conn_timeout=1800
statement_timeout=1800
security_enabled=false
csrf_enabled=false
sql_server_host=spark
sql_server_port=10000

[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs=hdfs://namenode:9000
webhdfs_url=http://namenode:9870/webhdfs/v1

[[yarn_clusters]]
[[[default]]]
submit_to=True
resourcemanager_host=resourcemanager
resourcemanager_port=8032
resourcemanager_api_url=http://resourcemanager:8088
proxy_api_url=http://resourcemanager:8088
history_server_api_url=http://resourcemanager:8188
spark_history_server_url=http://spark:18080

[notebook]
enable_session_measure=true

[[interpreters]]
[[[hive]]]
  name=Hive
  interface=hiveserver2
  options='{"server_host": "hive-server", "server_port": 10000}'
[[[pyspark]]]
  name=PySpark
  interface=livy
  options='{"url": "http://livy:8998", "api_url": "http://livy:8998", "driverMemory": "6g", "executorMemory": "10g", "executorCores": 10, "conf": {"spark.cores.max": "12", "spark.dynamicAllocation.enabled": "true", "spark.executor.memory": "10g", "spark.executor.cores": "10", "livy.rsc.sasl.enabled": "false"}}'
[[[sparksql]]]
  name=SparkSql
  interface=livy
  options='{"url": "http://livy:8998", "api_url": "http://livy:8998", "driverMemory": "6g", "executorMemory": "10g", "executorCores": 10, "conf": {"spark.cores.max": "12", "spark.dynamicAllocation.enabled": "true", "spark.executor.memory": "10g", "spark.executor.cores": "10", "livy.rsc.sasl.enabled": "false"}}'
