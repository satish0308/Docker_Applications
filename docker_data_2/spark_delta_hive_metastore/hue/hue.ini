[desktop]
app_blacklist=
[[database]]
engine=postgresql_psycopg2
host=postgres
port=5432
name=hue
user=hueuser
password=hivepassword

[beeswax]
hive_server_host=hive-server
hive_server_port=10000

[spark]
livy_server_url=http://livy:8998
server_url=http://livy:8998
api_url=http://livy:8998
security_enabled=false
csrf_enabled=false
sql_server_host=spark
sql_server_port=10000

[hadoop]
[[hdfs_clusters]]
[[[default]]]
fs_defaultfs=hdfs://namenode:9000
webhdfs_url=http://namenode:9870/webhdfs/v1

[[yarn_clusters]]
[[[default]]]
submit_to=True
resourcemanager_host=resourcemanager
resourcemanager_port=8032
resourcemanager_api_url=http://resourcemanager:8088
proxy_api_url=http://resourcemanager:8088
history_server_api_url=http://resourcemanager:8188
spark_history_server_url=http://spark:18080

[notebook]
enable_session_measure=true

[[interpreters]]
[[[hive]]]
  name=Hive
  interface=hiveserver2
  options='{"server_host": "hive-server", "server_port": 10000}'
[[[pyspark]]]
  name=PySpark
  interface=livy
  options='{"url": "http://livy:8998", "api_url": "http://livy:8998", "conf": {"livy.rsc.sasl.enabled": "false"}}'
[[[sparksql]]]
  name=SparkSql
  interface=livy
  options='{"url": "http://livy:8998", "api_url": "http://livy:8998", "conf": {"livy.rsc.sasl.enabled": "false"}}'
