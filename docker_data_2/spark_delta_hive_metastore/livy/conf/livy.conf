livy.spark.master = spark://spark:7077
livy.spark.deploy-mode = client
livy.server.host = 0.0.0.0
livy.server.port = 8998
livy.rsc.sasl.enabled = false

# Spark Resource Configuration for Livy Interactive Sessions
livy.spark.driver.memory = 6g
livy.spark.executor.memory = 10g
livy.spark.executor.cores = 10
livy.spark.cores.max = 12

# Auto-close sessions idle for 2 hours
livy.server.session.timeout = 2h
livy.server.session.timeout-check = true
livy.server.session.state-check.interval = 60s

# Limit maximum concurrent interactive sessions to prevent resource starvation
livy.server.session.max-creation = 4
livy.server.recovery.mode = off

# Dynamic Resource Allocation (DRA) for Livy Spark sessions
livy.spark.dynamicAllocation.enabled = true
livy.spark.dynamicAllocation.shuffleTracking.enabled = true
livy.spark.dynamicAllocation.executorIdleTimeout = 30s
livy.spark.dynamicAllocation.minExecutors = 0

# Default MinIO (S3A) configurations for all Livy sessions
livy.spark.hadoop.fs.s3a.endpoint = http://minio:9000
livy.spark.hadoop.fs.s3a.access.key = minioadmin
livy.spark.hadoop.fs.s3a.secret.key = minioadmin123
livy.spark.hadoop.fs.s3a.path.style.access = true
livy.spark.hadoop.fs.s3a.connection.ssl.enabled = false
livy.spark.hadoop.fs.s3a.aws.credentials.provider = org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Default Delta Lake & Hive configurations for all Livy sessions
livy.repl.enable-hive-context = true
livy.spark.sql.catalogImplementation = hive
livy.spark.sql.warehouse.dir = hdfs://namenode:9000/user/hive/warehouse
livy.spark.hadoop.fs.defaultFS = hdfs://namenode:9000
livy.spark.sql.extensions = io.delta.sql.DeltaSparkSessionExtension
livy.spark.sql.catalog.spark_catalog = org.apache.spark.sql.delta.catalog.DeltaCatalog

livy.spark.dynamicAllocation.maxExecutors = 12
livy.spark.deploy.defaultCores = 10
livy.rsc.driver-memory = 6g
livy.rsc.executor-memory = 10g
livy.rsc.executor-cores = 10

# Big Query Enterprise Network & Heartbeat Timeouts
livy.spark.network.timeout = 800s
livy.spark.executor.heartbeatInterval = 60s
livy.spark.sql.broadcastTimeout = 1800
livy.rsc.server.idle_timeout = 2h
livy.rsc.client.connect.timeout = 120s
