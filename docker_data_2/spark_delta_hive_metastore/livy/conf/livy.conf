livy.spark.master = spark://spark:7077
livy.spark.deploy-mode = client
livy.server.host = 0.0.0.0
livy.server.port = 8998
livy.rsc.sasl.enabled = false

# Cap each session's executor to 1 core (the total-cores cap that actually
# stops one app grabbing the whole cluster is enforced separately, at the
# Spark master, via spark.deploy.defaultCores).
livy.spark.executor.cores = 1

# Auto-close sessions idle for 30 minutes so abandoned Hue tabs release
# their executor cores back to the cluster instead of holding them forever.
livy.server.session.timeout = 30m
livy.server.session.timeout-check = true
